name: Auto Crawl and Deploy to GitHub Pages

on:
  schedule:
    # 每天每 4 小时自动触发一次全网岗位抓取 (UTC 时间)
    - cron: '0 */4 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crawler and Export Static Data
        run: |
          python export_static.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/jobs.json data/remote_jobs.db || true
          git commit -m "Auto: Update latest remote jobs [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or nothing to push"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
