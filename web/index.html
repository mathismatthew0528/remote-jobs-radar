<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & 远程工作全球职位雷达 | Remote Jobs Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .job-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="border-b border-slate-800 glass-panel sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-sky-500/20">
                    ⚡
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-lg font-bold bg-gradient-to-r from-sky-400 to-indigo-300 bg-clip-text text-transparent">
                            Remote AI Jobs Radar
                        </h1>
                        <span id="deployBadge" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            ☁️ GitHub Pages 运行中
                        </span>
                    </div>
                    <p class="text-xs text-slate-400">全球远程 AI 训练师 / 数据标注 / 中文双语岗位云端雷达</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="scanBtn" onclick="handleScanClick()" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-sky-600 hover:bg-sky-500 transition-all shadow-md shadow-sky-600/20 active:scale-95 disabled:opacity-50">
                    <span id="scanIcon" class="mr-2">🔄</span>
                    <span id="scanText">全网扫描刷新</span>
                </button>
                <button onclick="exportCSV()" class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-all">
                    📥 导出 CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <!-- 实时扫描进度条卡片 (本地与云端通知) -->
        <div id="progressCard" class="hidden glass-panel p-5 rounded-xl border border-sky-500/30 bg-gradient-to-r from-slate-900/90 via-sky-950/40 to-slate-900/90 shadow-xl transition-all duration-300">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping"></span>
                    <span class="text-sm font-semibold text-white" id="progressTitle">正在实时爬取全网最新岗位...</span>
                </div>
                <div class="text-sm font-bold text-sky-400" id="progressPercentText">0%</div>
            </div>

            <div class="w-full bg-slate-800/80 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                <div id="progressBar" class="bg-gradient-to-r from-sky-500 via-indigo-500 to-emerald-400 h-full rounded-full transition-all duration-300 shadow-sm" style="width: 0%"></div>
            </div>

            <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between text-xs text-slate-400 gap-2">
                <div id="progressStatusText" class="truncate font-medium text-slate-300">
                    准备中...
                </div>
                <div id="progressBadges" class="flex flex-wrap items-center gap-1.5 shrink-0"></div>
            </div>
        </div>

        <!-- 统计面板 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4" id="statsContainer">
            <div class="glass-panel p-4 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">当前监控岗位</div>
                <div class="text-2xl font-bold text-white mt-1" id="statTotal">-</div>
                <div class="text-xs text-sky-400 mt-1">Scale AI / RemoteOK 等</div>
            </div>
            <div class="glass-panel p-4 rounded-xl border border-slate-800 cursor-pointer hover:border-sky-500/50" onclick="setFilter('tag', '中文')">
                <div class="text-xs text-slate-400">🇨🇳 中文/双语专区</div>
                <div class="text-2xl font-bold text-emerald-400 mt-1" id="statChinese">-</div>
                <div class="text-xs text-slate-500 mt-1">点击筛选母语优势</div>
            </div>
            <div class="glass-panel p-4 rounded-xl border border-slate-800 cursor-pointer hover:border-sky-500/50" onclick="setFilter('min_score', 40)">
                <div class="text-xs text-slate-400">🔥 高契合度岗位</div>
                <div class="text-2xl font-bold text-amber-400 mt-1" id="statHighMatch">-</div>
                <div class="text-xs text-slate-500 mt-1">评分 >= 40 分</div>
            </div>
            <div class="glass-panel p-4 rounded-xl border border-slate-800 cursor-pointer hover:border-sky-500/50" onclick="setFilter('starred', '1')">
                <div class="text-xs text-slate-400">⭐ 我的收藏</div>
                <div class="text-2xl font-bold text-yellow-300 mt-1" id="statStarred">-</div>
                <div class="text-xs text-slate-500 mt-1">意向重点岗位</div>
            </div>
            <div class="glass-panel p-4 rounded-xl border border-slate-800 cursor-pointer hover:border-sky-500/50" onclick="setFilter('applied', '1')">
                <div class="text-xs text-slate-400">📬 投递追踪</div>
                <div class="text-2xl font-bold text-purple-400 mt-1" id="statApplied">-</div>
                <div class="text-xs text-slate-500 mt-1">已提交申请数</div>
            </div>
        </div>

        <!-- 筛选与搜索工具条 -->
        <div class="glass-panel p-4 rounded-xl border border-slate-800 space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" placeholder="搜索职位名称、公司、技能关键词 (如: Chinese, Scale AI, Prompt)..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
                           oninput="handleSearch()">
                </div>
            </div>

            <!-- 快捷标签过滤 -->
            <div class="flex flex-wrap gap-2 pt-1" id="filterTags">
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-sky-500 text-white" onclick="selectChip(this, '', '')">
                    全部岗位
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'tag', '中文')">
                    🇨🇳 中文/双语专区
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'tag', 'AI 训练师')">
                    🤖 AI 训练师
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'tag', '数据标注')">
                    🏷️ 数据标注
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'tag', '全球远程')">
                    🌏 全球远程
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'starred', '1')">
                    ⭐ 仅看收藏
                </button>
                <button class="filter-chip px-3 py-1 text-xs font-medium rounded-full transition-all bg-slate-800 text-slate-300 hover:bg-slate-700" onclick="selectChip(this, 'applied', '1')">
                    📬 仅看已投递
                </button>
            </div>
        </div>

        <!-- 岗位列表 -->
        <div class="space-y-3" id="jobsList">
            <div class="text-center py-12 text-slate-500">正在加载岗位数据...</div>
        </div>
    </main>

    <script>
        // 检测运行环境：如果是 GitHub Pages 或静态打开
        const isStaticHost = window.location.hostname.includes('github.io') || window.location.protocol === 'file:';
        if (isStaticHost) {
            document.getElementById('deployBadge').classList.remove('hidden');
        }

        let allJobsData = [];
        let globalStats = {};
        let currentFilter = {
            search: '',
            tag: '',
            min_score: 0,
            starred: '0',
            applied: '0'
        };

        // 本地离线持久化收藏与投递记录 (支持手机端与公网持久保存)
        function getLocalStarred() {
            try { return JSON.parse(localStorage.getItem('starred_jobs') || '[]'); } catch { return []; }
        }
        function getLocalApplied() {
            try { return JSON.parse(localStorage.getItem('applied_jobs') || '[]'); } catch { return []; }
        }
        function getLocalHidden() {
            try { return JSON.parse(localStorage.getItem('hidden_jobs') || '[]'); } catch { return []; }
        }

        let searchTimeout = null;
        let progressInterval = null;

        function loadInitialData() {
            if (isStaticHost) {
                // 静态模式：从 ./data/jobs.json 读取全量数据
                fetch('./data/jobs.json')
                    .then(res => res.json())
                    .then(data => {
                        allJobsData = data.jobs || [];
                        updateClientStats();
                        renderFilteredJobs();
                    })
                    .catch(err => {
                        document.getElementById('jobsList').innerHTML = `
                            <div class="glass-panel p-8 text-center text-slate-400">
                                正在等待 GitHub Actions 云端爬虫初次抓取生成数据...
                            </div>
                        `;
                    });
            } else {
                // 本地动态服务器模式
                loadStats();
                loadJobs();
            }
        }

        function updateClientStats() {
            const starred = getLocalStarred();
            const applied = getLocalApplied();
            const hidden = getLocalHidden();

            const visible = allJobsData.filter(j => !hidden.includes(j.job_id));
            const chinese = visible.filter(j => (j.tags || []).some(t => t.includes('中文') || t.includes('双语')));
            const highMatch = visible.filter(j => (j.match_score || 0) >= 40);

            document.getElementById('statTotal').innerText = visible.length;
            document.getElementById('statChinese').innerText = chinese.length;
            document.getElementById('statHighMatch').innerText = highMatch.length;
            document.getElementById('statStarred').innerText = starred.length;
            document.getElementById('statApplied').innerText = applied.length;
        }

        function renderFilteredJobs() {
            const list = document.getElementById('jobsList');
            const starred = getLocalStarred();
            const applied = getLocalApplied();
            const hidden = getLocalHidden();

            let filtered = allJobsData.filter(j => !hidden.includes(j.job_id));

            // 同步本地标记
            filtered.forEach(j => {
                if (isStaticHost) {
                    j.is_starred = starred.includes(j.job_id);
                    j.is_applied = applied.includes(j.job_id);
                }
            });

            if (currentFilter.search) {
                const s = currentFilter.search.toLowerCase();
                filtered = filtered.filter(j => 
                    (j.title || '').toLowerCase().includes(s) || 
                    (j.company || '').toLowerCase().includes(s) || 
                    (j.description || '').toLowerCase().includes(s)
                );
            }

            if (currentFilter.tag) {
                filtered = filtered.filter(j => (j.tags || []).some(t => t.includes(currentFilter.tag)));
            }

            if (currentFilter.min_score > 0) {
                filtered = filtered.filter(j => (j.match_score || 0) >= currentFilter.min_score);
            }

            if (currentFilter.starred === '1') {
                filtered = filtered.filter(j => j.is_starred);
            }

            if (currentFilter.applied === '1') {
                filtered = filtered.filter(j => j.is_applied);
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="glass-panel p-12 text-center rounded-xl border border-slate-800">
                        <div class="text-4xl mb-3">🔍</div>
                        <div class="text-slate-300 font-medium">没有找到匹配的岗位</div>
                        <div class="text-slate-500 text-sm mt-1">尝试更换关键词，或者点击右上角“全网扫描刷新”</div>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(job => renderJobCard(job)).join('');
        }

        function loadStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(res => {
                    if (res.code === 0) {
                        const d = res.data;
                        document.getElementById('statTotal').innerText = d.total || 0;
                        document.getElementById('statChinese').innerText = d.chinese || 0;
                        document.getElementById('statHighMatch').innerText = d.high_match || 0;
                        document.getElementById('statStarred').innerText = d.starred || 0;
                        document.getElementById('statApplied').innerText = d.applied || 0;
                    }
                });
        }

        function loadJobs() {
            const params = new URLSearchParams(currentFilter);
            fetch('/api/jobs?' + params.toString())
                .then(res => res.json())
                .then(res => {
                    const list = document.getElementById('jobsList');
                    if (!res.data || res.data.length === 0) {
                        list.innerHTML = `
                            <div class="glass-panel p-12 text-center rounded-xl border border-slate-800">
                                <div class="text-4xl mb-3">🔍</div>
                                <div class="text-slate-300 font-medium">没有找到匹配的岗位</div>
                                <div class="text-slate-500 text-sm mt-1">尝试更换关键词，或者点击右上角“全网扫描刷新”</div>
                            </div>
                        `;
                        return;
                    }
                    allJobsData = res.data;
                    list.innerHTML = res.data.map(job => renderJobCard(job)).join('');
                });
        }

        function renderJobCard(job) {
            const scoreClass = job.match_score >= 80 
                ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' 
                : (job.match_score >= 40 ? 'bg-sky-500/20 text-sky-300 border-sky-500/40' : 'bg-slate-700/50 text-slate-300 border-slate-600');

            const isStarred = job.is_starred ? '⭐ 已收藏' : '☆ 收藏';
            const starClass = job.is_starred ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'text-slate-400 hover:text-white border-slate-700';

            const isApplied = job.is_applied ? '✓ 已投递' : '+ 标记投递';
            const appliedClass = job.is_applied ? 'bg-purple-500/20 text-purple-300 border-purple-500/40' : 'text-slate-400 hover:text-white border-slate-700';

            const tagsHtml = (job.tags || []).map(t => 
                `<span class="px-2 py-0.5 text-xs rounded bg-slate-800/80 text-slate-300 border border-slate-700/60">${t}</span>`
            ).join('');

            return `
                <div class="job-card glass-panel p-5 rounded-xl border border-slate-800 transition-all duration-200" id="card-${job.job_id}">
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                        <div class="space-y-1.5 flex-1">
                            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                <span class="px-2 py-0.5 text-xs font-semibold rounded border ${scoreClass}">
                                    契合度: ${job.match_score}分
                                </span>
                                <span class="px-2 py-0.5 text-xs rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 font-medium">
                                    🏢 ${job.company}
                                </span>
                                <span class="px-2 py-0.5 text-xs rounded bg-slate-800 text-slate-400 border border-slate-700">
                                    ${job.platform}
                                </span>
                                ${job.location ? `<span class="text-xs text-slate-400">📍 ${job.location}</span>` : ''}
                                ${job.published_at ? `<span class="text-xs text-slate-500">📅 ${job.published_at}</span>` : ''}
                            </div>
                            <h2 class="text-lg font-bold text-white hover:text-sky-400 transition-colors">
                                <a href="${job.url}" target="_blank" rel="noopener">${job.title}</a>
                            </h2>
                            ${job.salary ? `<div class="text-xs font-medium text-emerald-400">💰 薪资: ${job.salary}</div>` : ''}
                        </div>

                        <!-- 操作按键 -->
                        <div class="flex items-center space-x-2 shrink-0">
                            <button onclick="toggleStar('${job.job_id}')" class="px-2.5 py-1.5 text-xs rounded-lg border transition-all ${starClass}">
                                ${isStarred}
                            </button>
                            <button onclick="toggleApplied('${job.job_id}')" class="px-2.5 py-1.5 text-xs rounded-lg border transition-all ${appliedClass}">
                                ${isApplied}
                            </button>
                            <a href="${job.url}" target="_blank" rel="noopener" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 hover:bg-sky-500 text-white transition-all shadow-md shadow-sky-600/20 flex items-center space-x-1">
                                <span>官网申请</span>
                                <span>↗</span>
                            </a>
                            <button onclick="hideJob('${job.job_id}')" title="忽略此职位" class="px-2 py-1.5 text-xs text-slate-500 hover:text-red-400 rounded-lg border border-transparent hover:border-red-500/30">
                                ✕
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 flex flex-wrap gap-1.5">
                        ${tagsHtml}
                    </div>

                    ${job.description ? `
                        <p class="mt-3 text-xs text-slate-400 line-clamp-2 leading-relaxed">
                            ${job.description}
                        </p>
                    ` : ''}
                </div>
            `;
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentFilter.search = document.getElementById('searchInput').value.trim();
                if (isStaticHost) renderFilteredJobs();
                else loadJobs();
            }, 300);
        }

        function setFilter(key, val) {
            currentFilter[key] = val;
            if (isStaticHost) renderFilteredJobs();
            else loadJobs();
        }

        function selectChip(btn, key, val) {
            document.querySelectorAll('.filter-chip').forEach(c => {
                c.classList.remove('bg-sky-500', 'text-white');
                c.classList.add('bg-slate-800', 'text-slate-300');
            });
            btn.classList.add('bg-sky-500', 'text-white');
            btn.classList.remove('bg-slate-800', 'text-slate-300');

            currentFilter.tag = '';
            currentFilter.starred = '0';
            currentFilter.applied = '0';
            currentFilter.min_score = 0;

            if (key) {
                currentFilter[key] = val;
            }
            if (isStaticHost) renderFilteredJobs();
            else loadJobs();
        }

        function handleScanClick() {
            if (isStaticHost) {
                const card = document.getElementById('progressCard');
                card.classList.remove('hidden');
                document.getElementById('progressTitle').innerText = '☁️ 云端自动化调度运行中';
                document.getElementById('progressPercentText').innerText = '已托管';
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressStatusText').innerHTML = `
                    GitHub Actions 云端定时爬虫每 3 小时自动巡检全网。<br>
                    您可以前往您的 GitHub 仓库的 <b>Actions</b> 标签页手动点击 <b>"Run workflow"</b> 立即触发全网重新抓取并自动发布。
                `;
                setTimeout(() => { card.classList.add('hidden'); }, 6000);
                return;
            }

            // 本地模式：调用 /api/scan
            fetch('/api/scan', { method: 'POST' })
                .then(res => res.json())
                .then(res => {
                    startProgressPolling();
                });
        }

        function startProgressPolling() {
            const card = document.getElementById('progressCard');
            const bar = document.getElementById('progressBar');
            const percentText = document.getElementById('progressPercentText');
            const statusText = document.getElementById('progressStatusText');
            const badges = document.getElementById('progressBadges');
            const scanBtn = document.getElementById('scanBtn');
            const scanIcon = document.getElementById('scanIcon');
            const scanText = document.getElementById('scanText');

            card.classList.remove('hidden');
            scanBtn.disabled = true;
            scanIcon.classList.add('animate-spin');

            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                fetch('/api/progress')
                    .then(res => res.json())
                    .then(res => {
                        if (res.code === 0) {
                            const p = res.data;
                            const percent = p.percent || 0;
                            bar.style.width = percent + '%';
                            percentText.innerText = percent + '%';
                            scanText.innerText = `正在抓取 (${percent}%)`;
                            statusText.innerText = p.status_text || '正在抓取中...';

                            if (p.sources_detail && p.sources_detail.length > 0) {
                                badges.innerHTML = p.sources_detail.map(s => 
                                    `<span class="px-2 py-0.5 rounded bg-slate-800 text-[11px] text-emerald-400 border border-emerald-500/30">✓ ${s.name}: ${s.count}个</span>`
                                ).join('');
                            }

                            if (!p.is_crawling && percent >= 100) {
                                clearInterval(progressInterval);
                                progressInterval = null;
                                scanBtn.disabled = false;
                                scanIcon.classList.remove('animate-spin');
                                scanText.innerText = '全网扫描刷新';
                                statusText.innerText = `✅ ${p.status_text}`;
                                loadStats();
                                loadJobs();

                                setTimeout(() => {
                                    card.classList.add('hidden');
                                }, 3500);
                            }
                        }
                    })
                    .catch(() => {});
            }, 600);
        }

        function toggleStar(jobId) {
            if (isStaticHost) {
                let list = getLocalStarred();
                if (list.includes(jobId)) list = list.filter(id => id !== jobId);
                else list.push(jobId);
                localStorage.setItem('starred_jobs', JSON.stringify(list));
                updateClientStats();
                renderFilteredJobs();
                return;
            }

            fetch('/api/job/toggle_star', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId })
            }).then(() => {
                loadStats();
                loadJobs();
            });
        }

        function toggleApplied(jobId) {
            if (isStaticHost) {
                let list = getLocalApplied();
                if (list.includes(jobId)) list = list.filter(id => id !== jobId);
                else list.push(jobId);
                localStorage.setItem('applied_jobs', JSON.stringify(list));
                updateClientStats();
                renderFilteredJobs();
                return;
            }

            fetch('/api/job/toggle_applied', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId })
            }).then(() => {
                loadStats();
                loadJobs();
            });
        }

        function hideJob(jobId) {
            if (isStaticHost) {
                let list = getLocalHidden();
                if (!list.includes(jobId)) list.push(jobId);
                localStorage.setItem('hidden_jobs', JSON.stringify(list));
                updateClientStats();
                renderFilteredJobs();
                return;
            }

            const card = document.getElementById(`card-${jobId}`);
            if (card) card.style.display = 'none';
            fetch('/api/job/hide', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId })
            }).then(() => {
                loadStats();
            });
        }

        function exportCSV() {
            if (!isStaticHost) {
                window.location.href = '/api/export';
                return;
            }

            // 前端纯静态模式下生成 CSV 并下载
            const header = ["ID", "职位名称", "公司", "平台", "匹配度", "薪资", "地点", "标签", "申请链接", "更新日期"];
            const rows = allJobsData.map(j => [
                j.job_id,
                `"${(j.title || '').replace(/"/g, '""')}"`,
                `"${(j.company || '').replace(/"/g, '""')}"`,
                j.platform,
                `${j.match_score}分`,
                `"${(j.salary || '').replace(/"/g, '""')}"`,
                `"${(j.location || '').replace(/"/g, '""')}"`,
                `"${(j.tags || []).join(', ')}"`,
                j.url,
                j.published_at
            ]);

            const csvContent = "\ufeff" + [header.join(","), ...rows.map(r => r.join(","))].join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "remote_jobs_export.csv";
            link.click();
        }

        // 初始化
        loadInitialData();
    </script>
</body>
</html>
